<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a6e"/>
      <stop offset="1" stop-color="#07061a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#ff5fa2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="52">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eee8ff"/>
      <stop offset="1" stop-color="#b3a3ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <!-- The cloud: three puffs on a rounded base. -->
  <g fill="url(#cloud)">
    <circle cx="19" cy="35" r="10"/>
    <circle cx="31" cy="26" r="13.5"/>
    <circle cx="45" cy="32" r="11"/>
    <rect x="8" y="33" width="48" height="17" rx="8.5"/>
  </g>
  <!-- Its happy face: cheeks, eyes with catchlights, a smile. -->
  <ellipse cx="18.5" cy="41.5" rx="3.6" ry="2.2" fill="#ff8fb3" opacity="0.75"/>
  <ellipse cx="45.5" cy="41.5" rx="3.6" ry="2.2" fill="#ff8fb3" opacity="0.75"/>
  <ellipse cx="25" cy="35.5" rx="3.2" ry="4.2" fill="#2a1d5e"/>
  <ellipse cx="39" cy="35.5" rx="3.2" ry="4.2" fill="#2a1d5e"/>
  <circle cx="24" cy="34" r="1.25" fill="#fff"/>
  <circle cx="38" cy="34" r="1.25" fill="#fff"/>
  <path d="M27.5 42.5q4.5 4 9 0" fill="none" stroke="#2a1d5e" stroke-width="2.6" stroke-linecap="round"/>
</svg>
